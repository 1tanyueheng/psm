; =====================================================================
; supervisord — runs nginx, php-fpm, the queue workers and the scheduler
; =====================================================================
; Keeping all of them in one container lets a single Render web service host
; the whole application. The alternative — separate services for the API, the
; scheduler, and the queue workers — costs more and adds nothing at this scale.
;
; Start order matters. Migrations create the `cache` table, and the queue
; workers' first action is to poll it. `priority` alone does NOT achieve this:
; it orders when supervisord *forks* each program, not when each finishes, so
; the workers reach RUNNING while `migrate` is still connecting. The workers
; are therefore gated behind an event listener — see [eventlistener:gate].
;
; Program list and their priorities:
;
;   5   php-fpm          needs no database
;   10  nginx            needs no database
;   15  migrate          creates the tables, exits when done
;   18  gate             waits for migrate to exit, then releases 20 and 30
;   20  queue-worker     x2, autostart=false
;   30  scheduler        autostart=false
;
; Only the programs in [group:psm] can be started by name via supervisorctl.
; Event listeners cannot be group members, which is why `gate` is outside it.
; =====================================================================

[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid
loglevel = info

; ---------------------------------------------------------------------
; 1. php-fpm — the Laravel runtime
; ---------------------------------------------------------------------
[program:php-fpm]
command = php-fpm --nodaemonize
priority = 5
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; 2. nginx — serves the built SPA and proxies to php-fpm over 127.0.0.1:9000
; ---------------------------------------------------------------------
[program:nginx]
command = nginx -g "daemon off;"
priority = 10
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; 3. Migrations — one-shot, runs before anything that touches the database
; ---------------------------------------------------------------------
; `autorestart = false` and `startretries = 0` so a genuine migration failure
; is reported once rather than looping. `startsecs = 0` because this program is
; *supposed* to exit — without it supervisord would judge the immediate exit a
; failed start and retry three times.
;
; Guarded by `RUN_MIGRATIONS` so local `docker compose up` does not migrate
; without being asked. The `--force` is required: production otherwise prompts
; for confirmation and, with no TTY attached, exits non-zero.
;
; Deliberately not fatal. A failed migration lets the container come up with a
; readable error, rather than exiting and being restarted by Docker into a loop
; that buries the actual SQL error.
; ---------------------------------------------------------------------
[program:migrate]
command = /bin/sh -c '
    if [ "$RUN_MIGRATIONS" = "true" ]; then
        echo "[migrate] RUN_MIGRATIONS=true - applying migrations";
        php /var/www/html/artisan migrate --force --no-interaction;
        status=$?;
        if [ "$status" -eq 0 ]; then
            echo "[migrate] Migrations applied.";
        else
            echo "[migrate] MIGRATION FAILED (exit $status).";
            echo "[migrate] The container will keep running so this error stays readable.";
            echo "[migrate] Re-run with: php artisan migrate --force";
        fi
        exit "$status";
    else
        echo "[migrate] RUN_MIGRATIONS is not true - skipping migrations";
        exit 0;
    fi'
priority = 15
autostart = true
autorestart = false
startsecs = 0
startretries = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; 4. Gate — releases the workers once migrations have finished
; ---------------------------------------------------------------------
; This is the part that makes the ordering real. See
; docker/wait-for-migrations.py for the full explanation and the event
; protocol details.
;
; `autorestart = true` because this listener is long-lived: if it ever exits,
; nothing would be left to start the workers. `startsecs = 0` because it must
; be considered started as soon as it writes READY, which is immediate.
; ---------------------------------------------------------------------
[eventlistener:gate]
command = /usr/bin/python3 /usr/local/bin/wait-for-migrations.py
events = PROCESS_STATE_EXITED

; Tells the listener where the control socket is, so its supervisorctl calls
; do not depend on supervisorctl's own default (which is a different path and
; would fail with "no such file"). Must match [unix_http_server] file above.
environment = SUPERVISOR_SERVER_URL="unix:///var/run/supervisor.sock"

priority = 18
autostart = true
autorestart = true
startsecs = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; 5. Queue workers — notifications and mail are queued
; ---------------------------------------------------------------------
; `autostart = false`: held STOPPED until the gate releases them. Everything
; else about this program is unchanged from a plain queue worker.
;
; `startsecs = 5` means supervisord counts a start as successful only after the
; worker stays up for 5 seconds, so a worker that dies immediately shows as a
; clean FATAL rather than an endless stream of WARN/exit pairs.
; ---------------------------------------------------------------------
[program:queue-worker]
command = php /var/www/html/artisan queue:work
    --sleep=3
    --tries=3
    --max-time=3600
    --max-jobs=500
    --no-interaction
process_name = %(program_name)s_%(process_num)02d
numprocs = 2
priority = 20
autostart = false
autorestart = true
startsecs = 5
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; 6. Scheduler — Module 6 (reminders), Module 3 (overdue flags, opening
;    milestones), Module 7 (audit prune). Runs schedule:work so the container
;    needs no host cron.
; ---------------------------------------------------------------------
; Also gated, for the same reason as the workers: `onOneServer()` locks in
; routes/console.php are rows in the `cache` table, which migrations create.
;
; Kept in the same container deliberately. With two replicas the onOneServer()
; locks prevent double-firing, but at this scale a single scheduler is simpler
; to reason about.
; ---------------------------------------------------------------------
[program:scheduler]
command = php /var/www/html/artisan schedule:work --no-interaction
priority = 30
autostart = false
autorestart = true
startsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; Group
; ---------------------------------------------------------------------
; Members of `psm`, addressable as `psm:queue-worker_00` etc. Event listeners
; cannot belong to a group, so `gate` is deliberately absent from this list.
; ---------------------------------------------------------------------
[group:psm]
programs = php-fpm,nginx,migrate,queue-worker,scheduler
