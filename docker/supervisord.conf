; =====================================================================
; supervisord — runs nginx, php-fpm and the queue worker together
; =====================================================================
; Keeping all three in one container lets a single Render web service host
; the whole application. The alternative — separate services for the API,
; the scheduler, and the queue worker — costs more and adds nothing at this
; scale.
; =====================================================================

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid
loglevel = warn

[program:php-fpm]
command = php-fpm --nodaemonize
priority = 5
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
priority = 10
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; Queue worker — notifications and mail are queued, so this must run or
; no email is ever delivered.
; ---------------------------------------------------------------------
[program:queue-worker]
command = php /var/www/html/artisan queue:work
    --sleep=3
    --tries=3
    --max-time=3600
    --max-jobs=500
process_name = %(program_name)s_%(process_num)02d
numprocs = 2
priority = 20
autostart = true
autorestart = true
startsecs = 5
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ---------------------------------------------------------------------
; Scheduler — Module 6 (reminders), Module 3 (overdue flags, opening
; milestones), Module 7 (audit prune). Runs schedule:work so the container
; needs no host cron.
;
; Kept in the same container deliberately: with two replicas, the
; onOneServer() locks in routes/console.php prevent double-firing, but at
; this scale a single scheduler is simpler to reason about.
; ---------------------------------------------------------------------
[program:scheduler]
command = php /var/www/html/artisan schedule:work
priority = 30
autostart = true
autorestart = true
startsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[group:psm]
programs = php-fpm,nginx,queue-worker,scheduler
