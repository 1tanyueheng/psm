; =====================================================================
; PSM Management System — PHP runtime configuration
; =====================================================================

[PHP]
; --- Error handling -------------------------------------------------
; Production default. Render sets APP_DEBUG=false; these ensure that a
; stray stack trace can never reach a browser even if it is switched on.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- Uploads --------------------------------------------------------
; Must exceed psm.submission.max_mb (default 25). These are set with
; headroom so a 25 MB submission plus multipart overhead is accepted.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 10

; Uploads are the one request that legitimately runs long: a milestone may
; carry up to 10 files, and the write to object storage is a network hop per
; file. 120s was reached in practice on a hosted deployment, and because
; nginx's `fastcgi_read_timeout` is 180s, PHP died first and the browser got
; a 502 with no CORS headers — which surfaces as a bare "Network Error" and
; tells the student nothing. These now sit below the nginx limit so nginx is
; always the outer bound and any timeout it reports is a clean, readable one.
;
; `max_input_time` covers parsing the request body, so it must be at least as
; generous as `max_execution_time` for a large multipart upload.
max_execution_time = 300
max_input_time = 300

; --- Memory ---------------------------------------------------------
; 256M is comfortable for grading a cohort; the reporting endpoints and
; Excel export are the heaviest operations.
memory_limit = 256M

; --- Timezone -------------------------------------------------------
date.timezone = Asia/Kuala_Lumpur

; --- Sessions -------------------------------------------------------
; The API is stateless (Sanctum tokens), but the password-reset landing
; page and the SPA shell use sessions.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; --- OPcache --------------------------------------------------------
; Tuned for a read-mostly deployment: the code never changes without a
; redeploy, so a large cache with no revalidation is correct.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; --- Security -------------------------------------------------------
expose_php = Off
