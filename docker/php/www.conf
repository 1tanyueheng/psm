; =====================================================================
; php-fpm pool configuration
; =====================================================================

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.backlog = 511

; --- Process management ---------------------------------------------
; dynamic is the right choice for a small container: it scales with load
; but releases workers when idle, which matters when the host bills for
; memory. pm.max_children is sized for a 512 MB container.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; --- Status ---------------------------------------------------------
pm.status_path = /fpm-status

; --- Request handling -----------------------------------------------
; A worker stuck for 180s is a bug, not a slow request; recycle it.
request_terminate_timeout = 180s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; --- Environment ----------------------------------------------------
clear_env = no

; --- Logging --------------------------------------------------------
; Straight to the container's stderr so the host captures it.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on

; --- Security -------------------------------------------------------
; No PHP execution outside the front controller.
security.limit_extensions = .php
