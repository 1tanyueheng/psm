; =====================================================================
; PSM Management System — LOCAL DEVELOPMENT ONLY
; =====================================================================
;
; Mounted into conf.d by docker-compose.yml so it loads *after*
; 99-psm.ini (conf.d is read in filename order, hence the zz- prefix).
; It is never copied into the image, so production keeps the tuned
; settings in docker/php/php.ini.
;
; Why this file exists:
;
; php.ini ships `opcache.validate_timestamps = 0`, which is correct for a
; read-mostly deployment — the code cannot change without a redeploy, so
; skipping the stat() on every request is free performance.
;
; But docker-compose bind-mounts ./backend over /var/www/html precisely so
; that "edits are picked up without a rebuild". Those two settings
; contradict each other: with validation off, PHP serves the *cached*
; bytecode for the file it first compiled, so a bind-mounted edit appears
; to do nothing at all. There is no error — the old behaviour simply
; continues, which makes it look like the change was wrong rather than
; stale.
;
; Turning revalidation back on here restores the documented workflow.
; `revalidate_freq = 0` means "stat on every request", which is what you
; want while editing.
;
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
