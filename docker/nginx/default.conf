# =====================================================================
# nginx — front controller for the PSM API and built SPA
# =====================================================================

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;   # must exceed php.ini post_max_size

    # --- Logging -----------------------------------------------------
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Compression -------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # --- Security headers --------------------------------------------
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"    always;

    # --- Health probe -------------------------------------------------
    # Matches Laravel's built-in /up route; bypasses PHP entirely so the
    # probe stays fast and cannot be affected by application errors.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # --- Public leaderboard -------------------------------------------
    # A plain SPA route. Kept as an explicit block so the no-login page is
    # documented in the server config, not only in the route file.
    location /leaderboard {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Immutable built assets ---------------------------------------
    # Vite fingerprints filenames, so these can be cached permanently.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Uploaded submissions ------------------------------------------
    # Served through the policy-checked download endpoint, never directly.
    # This block exists only to make that explicit.
    location /storage/ {
        # If files are ever served directly, deny directory listing and
        # script execution. Downloads normally go through the API.
        autoindex off;
        location ~ \.php$ { return 403; }
        try_files $uri =404;
    }

    # --- Framework internals -------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(storage/framework|bootstrap/cache) {
        deny all;
    }

    # --- Front controller -----------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Long enough for report generation and CSV export
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        include fastcgi_params;
    }

    # --- Deny dotfiles --------------------------------------------------
    location ~ /\.ht {
        deny all;
    }
}
