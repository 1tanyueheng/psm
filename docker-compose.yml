# =====================================================================
# PSM Management System — local development stack
# =====================================================================
# For local work, not production. Render builds the Dockerfile directly.
#
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
#
# Services:
#   app        Laravel API on :8000
#   db         MySQL 8 on :3306
#   mailpit    Catches all outgoing mail — UI on :8025
#   phpmyadmin Database browser on :8081 (optional, profile: tools)
# =====================================================================

services:

  # -------------------------------------------------------------------
  # Application — PHP-FPM + nginx + queue worker + scheduler
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: psm-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      APP_NAME: "PSM Management System"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173

      # Laravel needs this for encryption. Without it the app errors on every
      # request and nginx answers 502. Generated with `php artisan
      # key:generate --show`. Safe to commit for local development only —
      # never reuse this value in production, and never commit a real one.
      APP_KEY: "base64:1hZJov/zaokY9mLf4VOpfEwH8GQAr5u8DfmAXxYQzy8="

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: psm_system
      DB_USERNAME: psm
      DB_PASSWORD: secret

      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database

      # Mailpit swallows everything in development
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@psm.test
      MAIL_FROM_NAME: "${APP_NAME}"

      # SPA origin allowed to use cookie auth
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8000

      # --- PSM domain policy ---
      PSM_MILESTONE_BLEND_PERCENT: "20"
      LEADERBOARD_TOP_N: "3"
      LEADERBOARD_MIN_ASSESSORS: "2"
      REMINDER_DAYS_BEFORE: "7,3,1"
      SUPERVISOR_MAX_CAPACITY: "8"
      SUBMISSION_MAX_MB: "25"
      AUDIT_RETAIN_YEARS: "7"

      # Auto-migrate on boot for convenience in development only
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
    volumes:
      # Live-mount the source so edits are picked up without a rebuild.
      #
      # This mount shadows everything under backend/, including the compiled
      # SPA at public/build that the Dockerfile installed. For local work that
      # is fine — the `frontend` service serves the SPA over Vite with HMR on
      # :5173, and the API is only reached through the /api proxy. If you
      # instead want to exercise the single-service production arrangement,
      # comment this line out and run `docker compose up --build`.
      - ./backend:/var/www/html
      # Keep vendor from the image, otherwise a host-side composer install
      # would shadow the container's build
      - vendor-data:/var/www/html/vendor
      # Persist uploads and logs across restarts
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - psm

  # -------------------------------------------------------------------
  # Frontend — Vite dev server with HMR
  # -------------------------------------------------------------------
  # Optional while the SPA is being built. The root Dockerfile compiles the
  # SPA into the API's public dir for production, so this service is a
  # development convenience only.
  frontend:
    image: node:20-alpine
    container_name: psm-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_APP_NAME: "PSM Management System"

      # Vite proxies /api through to this target. It must be the *service
      # name* on the compose network, not localhost: inside the frontend
      # container, localhost is the container itself, so the default in
      # vite.config.js would proxy the API to nothing.
      #
      # Only matters for relative /api calls. VITE_API_URL above is absolute,
      # so the browser normally calls the API directly and this is a fallback.
      VITE_PROXY_TARGET: http://app:8080
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    profiles:
      - frontend
    networks:
      - psm

  # -------------------------------------------------------------------
  # Database
  # -------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: psm-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: psm_system
      MYSQL_USER: psm
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command:
      # utf8mb4 throughout: student names and abstracts contain characters
      # that a latin1 default would corrupt.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # Keep DDL transactional for migration rollbacks
      - --log-bin-trust-function-creators=1
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - psm

  # -------------------------------------------------------------------
  # Mail catcher — all outgoing mail lands here, never a real inbox
  # -------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: psm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - psm

  # -------------------------------------------------------------------
  # Database browser — start with: docker compose --profile tools up -d
  # -------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: psm-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: psm
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    profiles:
      - tools
    networks:
      - psm

volumes:
  db-data:
  storage-data:
  vendor-data:
  frontend-modules:

networks:
  psm:
    driver: bridge
